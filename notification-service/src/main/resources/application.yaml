spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/notificationDb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      format_sql: true
      dialect: org.hibernate.dialect.MySQL8Dialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
            auth: true
            starttls:
                enable: true
                required: true
                connectiontimeout: 5000
                timeout: 5000
                writetimeout: 5000


# 4. Internal Microservice URLs
services:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8001} # The port from your AuthController

# 5. Logging for Debugging Events
logging:
  level:
    root: INFO
    org.springframework.amqp: DEBUG # Watch RabbitMQ traffic
    org.identity_service.EliteCoach: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"



INTERSWITCH:
  GENERAL_CLIENT_ID: ${INTERSWITCH_GENERAL_CLIENT_ID:hello}
  GENERAL_CLIENT_SECRET: ${INTERSWITCH_GENERAL_CLIENT_SECRET:hello}

rabbitmq:
  uri: ${RABBITMQ_URL}


RESEND:
  key: ${RESEND_API_KEY}