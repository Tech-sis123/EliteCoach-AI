version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: elitecoach_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: elitecoach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: elitecoach_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: elitecoach_api
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: elitecoach_worker
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A app.tasks.main worker --loglevel=info

volumes:
  postgres_data:
